[workspace]
members = ["crates/rfm-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Proprietary"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
# TLS backend is selected per target in crates/rfm-core/Cargo.toml.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "gzip", "charset", "http2"] }
tokio = { version = "1.53.1", default-features = false, features = ["time", "sync", "rt", "net"] }
base64 = "0.23.1"
uuid = { version = "1.26.1", default-features = false, features = ["v4", "std"] }
sha2 = "0.11.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
